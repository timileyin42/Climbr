[project]
name = "climbr-backend"
version = "0.1.0"
description = "Climbr career platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.136.3",
    "uvicorn==0.47.0",
    "python-multipart==0.0.29",
    "sqlalchemy==2.0.49",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.12",
    "PyJWT==2.13.0",
    "passlib==1.7.4",
    "bcrypt==4.3.0",
    "argon2-cffi==23.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "resend==2.30.1",
    "boto3==1.28.38",
    "Pillow==12.2.0",
    "python-magic==0.4.27",
    "firebase-admin==7.4.0",
    "jinja2==3.1.6",
    "apscheduler==3.11.2",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "slowapi==0.1.9",
    "cryptography==48.0.0",
]

[tool.fastapi]
app = "app.main:app"
