name: climbr
description: Climbr — career platform for African talent
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.2
  flutter_hooks: ^0.20.5

  # Routing
  go_router: ^14.2.0

  # Motion
  flutter_animate: ^4.5.0

  # Network
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.2.2

  # Firebase + Google Sign-In
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # SPM is globally disabled (flutter config --no-enable-swift-package-manager)
  # so these now install via CocoaPods, bypassing the broken DKImagePickerController SPM rev.
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
