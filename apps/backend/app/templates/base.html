<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{% block title %}Climbr{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

<!-- ── Outer wrapper ────────────────────────────────────────────────────── -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;min-width:100%;">
  <tr>
    <td align="center" style="padding:40px 16px 32px;">

      <!-- ── Email card ─────────────────────────────────────────────────── -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;background-color:#ffffff;">

        <!-- HEADER BAR: cyan, logo left + type label right -->
        <tr>
          <td style="background-color:#0CC0DF;padding:18px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;">
                  <span style="font-size:20px;font-weight:700;color:#ffffff;font-family:Arial,Helvetica,sans-serif;letter-spacing:-0.3px;">Climbr</span>
                </td>
                <td align="right" style="vertical-align:middle;">
                  <span style="font-size:11px;font-weight:700;color:#ffffff;font-family:Arial,Helvetica,sans-serif;letter-spacing:1.8px;text-transform:uppercase;">{% block label %}NOTIFICATION{% endblock %}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- BODY: all email-specific content goes here -->
        <tr>
          <td style="padding:36px 32px 28px;background-color:#ffffff;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- SEPARATOR -->
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td height="1" style="background-color:#E5E7EB;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- FOOTER ROW: dark pill logo left, social circles right -->
        <tr>
          <td style="padding:20px 32px 24px;background-color:#ffffff;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;">
                  <span style="display:inline-block;background-color:#111827;color:#ffffff;padding:8px 18px;border-radius:50px;font-size:13px;font-weight:700;font-family:Arial,Helvetica,sans-serif;">Climbr</span>
                </td>
                <td align="right" style="vertical-align:middle;">
                  <a href="#" style="display:inline-block;width:32px;height:32px;background-color:#111827;border-radius:50%;text-align:center;line-height:32px;color:#ffffff;text-decoration:none;font-size:13px;font-weight:700;font-family:Arial,Helvetica,sans-serif;margin-left:6px;">f</a><!--
                  --><a href="#" style="display:inline-block;width:32px;height:32px;background-color:#111827;border-radius:50%;text-align:center;line-height:32px;color:#ffffff;text-decoration:none;font-size:12px;font-weight:700;font-family:Arial,Helvetica,sans-serif;margin-left:6px;">X</a><!--
                  --><a href="#" style="display:inline-block;width:32px;height:32px;background-color:#111827;border-radius:50%;text-align:center;line-height:32px;color:#ffffff;text-decoration:none;font-size:11px;font-weight:700;font-family:Arial,Helvetica,sans-serif;margin-left:6px;">ig</a><!--
                  --><a href="#" style="display:inline-block;width:32px;height:32px;background-color:#111827;border-radius:50%;text-align:center;line-height:32px;color:#ffffff;text-decoration:none;font-size:11px;font-weight:700;font-family:Arial,Helvetica,sans-serif;margin-left:6px;">in</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
      <!-- End email card -->

      <!-- COPYRIGHT below card -->
      <p style="margin:16px 0 0;font-size:12px;color:#9CA3AF;font-family:Arial,Helvetica,sans-serif;text-align:center;line-height:1.6;">
        &copy; 2025 Climbr. All rights reserved.
      </p>

    </td>
  </tr>
</table>

</body>
</html>
