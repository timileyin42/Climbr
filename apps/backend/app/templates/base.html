<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}Climbr{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F0F4F7;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#F0F4F7" style="background-color:#F0F4F7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px;width:100%;">

          <!-- HEADER -->
          <tr>
            <td align="center" bgcolor="#FF8A3D" style="background-color:#FF8A3D;border-radius:16px 16px 0 0;padding:32px 40px;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td valign="middle" style="padding-right:10px;">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
                      <rect width="44" height="44" rx="11" fill="rgba(255,255,255,0.18)"/>
                      <polygon points="22,7 36,34 8,34" fill="#FFFFFF"/>
                      <polygon points="22,17 27,34 17,34" fill="rgba(255,138,61,0.45)"/>
                      <circle cx="22" cy="7" r="3.5" fill="#0CC0DF"/>
                    </svg>
                  </td>
                  <td valign="middle">
                    <span style="font-size:30px;font-weight:800;color:#0CC0DF;letter-spacing:-0.5px;font-family:Arial,Helvetica,sans-serif;line-height:1;">Climbr</span>
                  </td>
                </tr>
              </table>
              <p style="margin:10px 0 0;color:rgba(255,255,255,0.85);font-size:13px;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.3px;">Connecting Talent with Opportunity</p>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td bgcolor="#FFFFFF" style="background:#FFFFFF;padding:40px 40px 32px;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td align="center" bgcolor="#F9FAFB" style="background:#F9FAFB;padding:24px 40px 28px;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;border-radius:0 0 16px 16px;">
              <p style="margin:0 0 3px;font-size:15px;font-weight:700;color:#0F1A1F;font-family:Arial,Helvetica,sans-serif;">Climbr</p>
              <p style="margin:0 0 12px;font-size:12px;color:#9CA3AF;font-family:Arial,Helvetica,sans-serif;">Your career growth platform</p>
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="80%" style="margin:0 auto 12px;">
                <tr><td height="1" bgcolor="#E5E7EB" style="background-color:#E5E7EB;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
              <p style="margin:0;font-size:11px;color:#9CA3AF;line-height:1.6;font-family:Arial,Helvetica,sans-serif;">
                Sent because you have a Climbr account &nbsp;&bull;&nbsp;
                <a href="mailto:support@climbr.com" style="color:#FF8A3D;text-decoration:none;">support@climbr.com</a>
              </p>
              <p style="margin:6px 0 0;font-size:11px;color:#C4CDD6;font-family:Arial,Helvetica,sans-serif;">&copy; 2025 Climbr. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
